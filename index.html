<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; frame-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'">
  <title>Smart Drops · Smart Water Management</title>
  <link rel="icon" type="image/png" href="./assets/smart-drops-logo.png">
  <style>
    :root { color-scheme: dark; --canvas-scale: 1; --canvas-width: 1920px; --canvas-height: 1080px; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101c24; }
    body { display: grid; place-items: center; }
    #app-stage { width: var(--canvas-width); height: var(--canvas-height); overflow: hidden; flex: none; }
    #app-frame { display: block; width: 1920px; height: 1080px; border: 0; background: #14242e; transform: scale(var(--canvas-scale)); transform-origin: 0 0; }
  </style>
</head>
<body>
  <div id="app-stage"><iframe id="app-frame" src="./app.html" title="Smart Drops water management application" allowfullscreen></iframe></div>
  <script>
    // Keep a 1920 × 1080 design viewport at every browser size. Unused space shows the background.
    (function () {
      function fitCanvas() {
        var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty('--canvas-scale', String(scale));
        document.documentElement.style.setProperty('--canvas-width', (1920 * scale) + 'px');
        document.documentElement.style.setProperty('--canvas-height', (1080 * scale) + 'px');
      }
      window.addEventListener('resize', fitCanvas);
      document.addEventListener('fullscreenchange', fitCanvas);
      fitCanvas();
    }());
  </script>
</body>
</html>
